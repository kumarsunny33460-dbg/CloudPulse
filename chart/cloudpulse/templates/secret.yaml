{{- if .Values.config.createSecret }}
{{/*
Rendered only when config.createSecret is true.

RECOMMENDATION: leave config.createSecret false in every shared or production
environment and manage the Secret with External Secrets Operator, the Secrets
Store CSI driver, or SOPS. When createSecret is false this template emits
nothing and the Deployment instead mounts the Secret named by
config.existingSecret, which must already exist in the release namespace:

  kubectl -n <namespace> create secret generic cloudpulse-secrets \
    --from-literal=DATABASE_URL='postgresql://...' \
    --from-literal=SECRET_KEY='<long random value>'

The template refuses to render if createSecret is true while the two required
keys are empty, so a pod can never start with a blank SECRET_KEY.
*/}}
{{- $required := list "SECRET_KEY" "DATABASE_URL" -}}
{{- range $key := $required -}}
  {{- if not (get $.Values.config $key) -}}
    {{- fail (printf "config.%s must be set when config.createSecret is true. Set it, or point config.existingSecret at a pre-created Secret." $key) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudpulse.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
  annotations:
    # Removes the Secret when the release is uninstalled. Remove this line if
    # the Secret is owned by an external secrets controller instead.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRET_KEY: {{ required "config.SECRET_KEY is required" .Values.config.SECRET_KEY | quote }}
  DATABASE_URL: {{ required "config.DATABASE_URL is required" .Values.config.DATABASE_URL | quote }}
  {{- $sensitive := include "cloudpulse.secretKeys" . | fromJsonArray }}
  {{- $structural := include "cloudpulse.structuralKeys" . | fromJsonArray }}
  {{- range $key, $value := .Values.config }}
    {{- if and (has $key $sensitive) (not (has $key $structural)) (ne $key "SECRET_KEY") (ne $key "DATABASE_URL") }}
  {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.config.extraSecret }}
    {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- else }}
{{/*
config.createSecret is false: no Secret is created by this chart.
Provide the Secret named by .Values.config.existingSecret out of band, for
example:

  helm upgrade --install cloudpulse ./chart/cloudpulse \
    --set config.existingSecret=cloudpulse-secrets
*/}}
{{- end }}
