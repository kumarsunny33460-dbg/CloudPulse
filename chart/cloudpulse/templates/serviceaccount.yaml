{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudpulse.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# CloudPulse never calls the Kubernetes API, so the default service account
# token is not mounted into the container.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
