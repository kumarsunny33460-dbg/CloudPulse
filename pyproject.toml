# CloudPulse development tooling: linting, formatting and test configuration.

[project]
name = "cloudpulse"
version = "1.0.0"
description = "Cloud native application monitoring and incident management platform"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "migrations", "instance"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # Flask routes legitimately call functions in defaults
    "SIM105",  # contextlib.suppress is slower than try/except in hot paths
]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"]
"app/api/*" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["app"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
]
markers = [
    "smoke: fast checks that only assert the app boots and serves pages",
    "integration: tests that exercise the REST API end to end",
]
