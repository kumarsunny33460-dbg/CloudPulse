name: CloudPulse CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # JOB 1 — RUN AUTOMATED TESTS
  # ==========================================================

  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run automated tests
        run: |
          pytest tests -v


  # ==========================================================
  # JOB 2 — BUILD AND PUBLISH DOCKER IMAGE
  # ==========================================================

  docker-build:
    name: Build and Publish CloudPulse Docker Image
    runs-on: ubuntu-latest

    needs: test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudpulse:latest
            ghcr.io/${{ github.repository_owner }}/cloudpulse:${{ github.sha }}


      - name: Verify Docker image
        run: |
          echo "CloudPulse Docker image published successfully."
          echo "Registry: ghcr.io"
          echo "Repository: ${{ github.repository_owner }}/cloudpulse"
          echo "Commit: ${{ github.sha }}"