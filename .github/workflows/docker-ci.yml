name: CloudPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ==========================================================
  # JOB 1 — LINT
  # ==========================================================

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check app tools tests

      # A workflow file with a syntax error is rejected whole, so not one job
      # runs and the failure reports zero jobs and no reason. Adding a
      # `services:` block to a step instead of the job did exactly that, and six
      # consecutive runs failed with nothing to act on. actionlint is what names
      # the offending line.
      #
      # Not `uses: docker://rhysd/actionlint`: that image ships no shell, so
      # there is no directory to mount the checkout into and it exits 1 on the
      # first step for that reason alone.
      - name: Validate the workflow files
        run: |
          set -euo pipefail

          curl -sSfL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /tmp actionlint
          chmod +x /tmp/actionlint

          # One file at a time with the result echoed. A single glob hides which
          # file was at fault, and a silent failure here means the workflow is
          # not being checked at all, which is the failure mode it exists to
          # prevent.
          status=0
          for workflow in .github/workflows/*.yml; do
            echo "::group::$workflow"
            if ! /tmp/actionlint "$workflow"; then
              status=1
            fi
            echo "::endgroup::"
          done

          if [ "$status" -ne 0 ]; then
            echo "A workflow file has a syntax error; see the output above."
            exit 1
          fi
          echo "All workflow files are valid."

  # ==========================================================
  # JOB 2 — INFRASTRUCTURE CONFIG
  #
  # Terraform, Helm and the Kubernetes manifests are shipped code: a syntax
  # error in any of them only surfaces at deploy time, long after review. This
  # job renders and lints them on every pull request.
  # ==========================================================

  infra:
    name: Validate infrastructure config
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Lint and render the Helm chart
        run: |
          helm lint chart/cloudpulse
          helm template cloudpulse chart/cloudpulse > /dev/null
          # Ingress enabled, so the full template path is exercised too.
          helm template cloudpulse chart/cloudpulse \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.prometheusRule.enabled=true > /dev/null

      - name: Render the Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/staging > /dev/null
          kubectl kustomize k8s/overlays/production > /dev/null

      - name: Validate every YAML file parses
        run: |
          pip install pyyaml
          python - <<'PY'
          import pathlib, sys, yaml

          paths = sorted(
              list(pathlib.Path("monitoring").rglob("*.yml"))
              + list(pathlib.Path("k8s").rglob("*.yaml"))
              + [pathlib.Path("docker-compose.yml")]
          )
          for path in paths:
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except Exception as error:
                  print(f"FAIL {path}: {error}")
                  sys.exit(1)
              print(f"ok   {path}")
          print(f"{len(paths)} YAML files parsed")
          PY

      # Both images ship the binary but not as their entrypoint:
      # prom/prometheus runs /bin/prometheus, so appending "promtool ..." to the
      # command produces "prometheus: error: unexpected promtool". --entrypoint
      # is what makes the validator actually run.
      - name: Validate the Prometheus and Alertmanager configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

          docker run --rm \
            --entrypoint amtool \
            -v "$PWD/monitoring:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

  # ==========================================================
  # JOB 3 — TEST
  # ==========================================================

  test:
    name: Run Application Tests
    runs-on: ubuntu-latest
    needs: lint

    # A real PostgreSQL for the whole job. The suite runs on SQLite, and SQLite
    # accepts things PostgreSQL rejects -- notably `DEFAULT 0` on a BOOLEAN
    # column -- so the schema repair path was never exercised against the engine
    # that first refused it, and the first Render deploy died on exactly that.
    #
    # `services` belongs to the job, not to a step: putting it on a step is a
    # syntax error, and GitHub rejects the whole workflow file rather than one
    # step, so no jobs ran at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: cloudpulse
          POSTGRES_DB: cloudpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Verify the application imports cleanly
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); from app import create_app; create_app('testing')"

      # With no usable key the application no longer crashes: it starts in
      # diagnostic mode and serves a page naming the variable to set, because a
      # crashed worker is reported by every PaaS as a bare 503. What must hold is
      # that nothing behind that page answers and no session can be issued.
      #
      # CLOUDPULSE_SKIP_APP_BUILD stops app.py building an application at import
      # time, so the import succeeds and the check below can drive create_app.
      - name: Production without a usable SECRET_KEY serves only a setup page
        env:
          APP_ENV: production
          CLOUDPULSE_SKIP_APP_BUILD: "1"
        run: |
          python - <<'PY'
          import os
          import sys

          os.environ.pop("SECRET_KEY", None)
          os.environ.pop("ALLOW_INSECURE_SECRET_KEY", None)

          sys.path.insert(0, "app")
          from app import create_app

          app = create_app("production")
          client = app.test_client()

          page = client.get("/")
          assert page.status_code == 200, f"expected the setup page, got {page.status_code}"
          assert b"SECRET_KEY" in page.data, "the page must name the variable"
          assert b"Generate" in page.data, "the page must say what to press"

          for path in ("/api/applications", "/api/cicd", "/metrics"):
              status = client.get(path).status_code
              assert status == 503, f"{path} answered {status} without a signing key"

          health = client.get("/health")
          assert health.status_code == 503
          assert health.get_json()["status"] == "misconfigured"

          print("No usable key: the setup page renders and nothing else answers.")
          PY

      # A key published in this repository is refused by name, because anyone
      # who can read the repository could then forge a session cookie.
      - name: Production refuses published placeholder secret keys
        env:
          APP_ENV: production
          CLOUDPULSE_SKIP_APP_BUILD: "1"
          SECRET_KEY: replace-me-with-a-long-random-value
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "app")
          from config import secret_key_problem

          problem = secret_key_problem()
          assert problem is not None, "a key published in this repository must be refused"
          assert "published in this repository" in problem, problem

          print("Refused the published placeholder, as expected:")
          print("   ", problem)
          PY

      # And a generated one is accepted, which is the state a real deploy is in.
      - name: Production accepts a generated secret key
        env:
          APP_ENV: production
          CLOUDPULSE_SKIP_APP_BUILD: "1"
          SESSION_COOKIE_SECURE: "false"
        run: |
          python - <<'PY'
          import os
          import secrets
          import sys

          os.environ["SECRET_KEY"] = secrets.token_urlsafe(48)
          os.environ["DATABASE_URL"] = ""

          sys.path.insert(0, "app")
          from app import create_app

          app = create_app("production")
          client = app.test_client()

          for path in ("/health", "/login", "/register", "/api/cicd"):
              status = client.get(path).status_code
              assert status == 200, f"{path} answered {status} with a real key"

          assert client.get("/").status_code == 302, "the dashboard should require a session"

          print("A generated key serves the application normally.")
          PY

      # The driver for a provider DATABASE_URL is pinned in normalize_database_url.
      # SQLAlchemy 2.0 resolves a bare postgresql:// to psycopg2 and 2.1 to
      # psycopg (v3); only psycopg2-binary is installed, so a build that picked
      # up the newer release died at boot with "No module named 'psycopg'".
      # This fails here instead, where the log is readable.
      - name: A provider DATABASE_URL resolves to an installed driver
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "app")

          from sqlalchemy.engine import make_url
          from config import normalize_database_url

          for provider_url in (
              "postgres://cloudpulse:secret@db.internal:5432/cloudpulse",
              "postgresql://cloudpulse:secret@db.internal:5432/cloudpulse",
          ):
              normalised = normalize_database_url(provider_url)
              driver = make_url(normalised).drivername
              assert driver == "postgresql+psycopg2", f"{provider_url} -> {driver}"

          # Importing the dbapi is what actually failed on Render.
          from sqlalchemy import create_engine
          engine = create_engine(
              "postgresql+psycopg2://u:p@127.0.0.1:1/db", connect_args={"connect_timeout": 1}
          )
          try:
              engine.connect()
          except Exception as error:
              assert "psycopg2" in str(type(error).__module__) or "OperationalError" in type(error).__name__, (
                  f"the driver failed to load: {type(error).__module__}.{type(error).__name__}"
              )
              print(f"Driver loaded: {type(error).__module__}")
          else:
              raise SystemExit("expected the connection to 127.0.0.1:1 to fail")
          PY

      # The schema sync generates ALTER TABLE statements that SQLite accepts and
      # PostgreSQL rejects. The first Render deploy failed on
      #   column "is_verified" is of type boolean but default expression is of
      #   type integer
      # which left the column missing and broke every query afterwards. The
      # whole suite runs on SQLite, so the real engine is needed here.
      - name: Schema sync against a real PostgreSQL
        env:
          DATABASE_URL: postgresql://cloudpulse:cloudpulse@localhost:5432/cloudpulse_test
          AUTO_CREATE_SCHEMA: "true"
          AUTO_SCHEMA_SYNC: "true"
          APP_ENV: development
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "app")

          from sqlalchemy import text
          from app import create_app
          from extensions import db
          from services import schema as schema_service

          app = create_app("development")

          with app.app_context():
              db.drop_all()

              # An older deployment: the newer columns are absent, which is
              # exactly the state the sync exists to repair.
              db.session.execute(text(
                  "CREATE TABLE users ("
                  "id SERIAL PRIMARY KEY, username VARCHAR(80) NOT NULL, "
                  "email VARCHAR(255) NOT NULL, password_hash VARCHAR(255) NOT NULL, "
                  "role VARCHAR(20) NOT NULL DEFAULT 'Viewer', "
                  "created_at TIMESTAMP NOT NULL)"
              ))
              db.session.commit()

              schema_service.sync_schema()

              columns = [
                  row[0] for row in db.session.execute(text(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_name = 'users'"))
              ]
              assert "is_verified" in columns, (
                  f"users.is_verified was not created; columns: {columns}"
              )
              print(f"users.is_verified created; {len(columns)} columns present.")

              # And it is usable, which is the part that actually failed.
              from models import User
              from werkzeug.security import generate_password_hash

              db.session.add(User(
                  username="ci", email="ci@cloudpulse.test",
                  password_hash=generate_password_hash("Str0ng!Passw0rd"),
                  role="Admin",
              ))
              db.session.commit()

              user = db.session.query(User).filter_by(email="ci@cloudpulse.test").one()
              print(f"user.is_verified = {user.is_verified!r}")
          PY

      - name: Run automated tests
        run: |
          pytest tests -v

  # ==========================================================
  # JOB 4 — SECURITY SCAN
  # ==========================================================

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt --strict || true

      # Pinned to the CLI container rather than the composite action.
      #
      # gitleaks-action reads repository events to build its scan range, so
      # without GITHUB_TOKEN it fails on a fork or a repository with actions
      # disabled, and with the token it only scans the diff of the current
      # event rather than the history it claims to cover. Running the CLI
      # directly over the checked-out history needs neither.
      - name: Scan the full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          # Scan every commit, not just the one that triggered this run.
          log-opts: "--all"
          config: .gitleaks.toml
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Second pass with the gitleaks CLI over the history
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --log-opts="--all" \
            --redact

      # gitleaks has no configuration in this repository, so its default rules
      # apply. Every match this has ever produced was a false positive: git
      # object ids, documentation placeholders, and files inside the local
      # .venv. Run the two passes above rather than trusting a scan of only the
      # current diff.

  # ==========================================================
  # JOB 5 — DOCKER IMAGE
  # ==========================================================

  docker-build:
    name: Build and Publish CloudPulse Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, infra]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=CloudPulse
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudpulse:latest
            ghcr.io/${{ github.repository_owner }}/cloudpulse:${{ github.sha }}

      # The key must satisfy the same production check the application enforces:
      # at least 32 characters and not one of the published placeholders. A
      # short value here is refused at boot, so the smoke test would fail on the
      # security check rather than on anything to do with the image.
      - name: Smoke test the published image
        run: |
          # Pull first so a registry failure is reported as itself rather than
          # as twenty failed health checks.
          docker pull ghcr.io/${{ github.repository_owner }}/cloudpulse:${{ github.sha }}

          # The key must satisfy the same production check the application
          # enforces: at least 32 characters and not one of the published
          # placeholders. A short value here is refused at boot, so the smoke
          # test would fail on the security check rather than on the image.
          docker run -d --name cloudpulse-smoke \
            -e APP_ENV=production \
            -e SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/cloudpulse:${{ github.sha }}

          # 60 attempts of 3 seconds is three minutes. A cold runner that just
          # pulled a 300 MB image can take well over the 40 seconds this
          # previously allowed, and the failure then says nothing about why.
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:5000/health; then
              echo ""
              echo "Image is healthy after ${attempt} attempt(s)."
              docker rm -f cloudpulse-smoke
              exit 0
            fi
            # Stop early if the container has already given up.
            if [ "$(docker inspect -f '{{.State.Status}}' cloudpulse-smoke 2>/dev/null)" = "exited" ]; then
              break
            fi
            sleep 3
          done

          echo "::error::The published image never became healthy."
          echo "--- container state ---"
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' cloudpulse-smoke || true
          echo "--- container logs ---"
          docker logs cloudpulse-smoke 2>&1 | tail -60 || true
          docker rm -f cloudpulse-smoke || true
          exit 1

      - name: Verify Docker image
        run: |
          echo "CloudPulse Docker image published successfully."
          echo "Registry: ghcr.io"
          echo "Repository: ${{ github.repository_owner }}/cloudpulse"
          echo "Commit: ${{ github.sha }}"
