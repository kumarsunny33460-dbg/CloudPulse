name: CloudPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ==========================================================
  # JOB 1 — LINT
  # ==========================================================

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check app tools tests

  # ==========================================================
  # JOB 2 — INFRASTRUCTURE CONFIG
  #
  # Terraform, Helm and the Kubernetes manifests are shipped code: a syntax
  # error in any of them only surfaces at deploy time, long after review. This
  # job renders and lints them on every pull request.
  # ==========================================================

  infra:
    name: Validate infrastructure config
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Lint and render the Helm chart
        run: |
          helm lint chart/cloudpulse
          helm template cloudpulse chart/cloudpulse > /dev/null
          # Ingress enabled, so the full template path is exercised too.
          helm template cloudpulse chart/cloudpulse \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.prometheusRule.enabled=true > /dev/null

      - name: Render the Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/staging > /dev/null
          kubectl kustomize k8s/overlays/production > /dev/null

      - name: Validate every YAML file parses
        run: |
          pip install pyyaml
          python - <<'PY'
          import pathlib, sys, yaml

          paths = sorted(
              list(pathlib.Path("monitoring").rglob("*.yml"))
              + list(pathlib.Path("k8s").rglob("*.yaml"))
              + [pathlib.Path("docker-compose.yml")]
          )
          for path in paths:
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except Exception as error:
                  print(f"FAIL {path}: {error}")
                  sys.exit(1)
              print(f"ok   {path}")
          print(f"{len(paths)} YAML files parsed")
          PY

      - name: Validate the Prometheus and Alertmanager configuration
        run: |
          docker run --rm \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            promtool check config /etc/prometheus/prometheus.yml

          docker run --rm \
            -v "$PWD/monitoring:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            amtool check-config /etc/alertmanager/alertmanager.yml

  # ==========================================================
  # JOB 3 — TEST
  # ==========================================================

  test:
    name: Run Application Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Verify the application imports cleanly
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); from app import create_app; create_app('testing')"

      # CLOUDPULSE_SKIP_APP_BUILD stops app.py building an application at
      # import time, so the import can succeed and the failure is reported by
      # create_app() itself. Without it the module-level `app = create_app()`
      # raises during the import and the try/except below never runs.
      - name: Production refuses to boot without a SECRET_KEY
        env:
          APP_ENV: production
          CLOUDPULSE_SKIP_APP_BUILD: "1"
        run: |
          python - <<'PY'
          import os
          import sys

          os.environ.pop("SECRET_KEY", None)
          os.environ.pop("ALLOW_INSECURE_SECRET_KEY", None)

          sys.path.insert(0, "app")
          from app import create_app

          try:
              create_app("production")
          except RuntimeError as error:
              print("Refused to boot, as expected:")
              print("   ", error)
              sys.exit(0)

          print("FAIL: production booted without a SECRET_KEY")
          sys.exit(1)
          PY

      # The same check for a key that is published in this repository, and for
      # one that is simply too short to be a real signing key.
      - name: Production refuses published placeholder secret keys
        env:
          APP_ENV: production
          CLOUDPULSE_SKIP_APP_BUILD: "1"
          SECRET_KEY: replace-me-with-a-long-random-value
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "app")
          from app import create_app

          try:
              create_app("production")
          except RuntimeError as error:
              print("Refused the published placeholder, as expected:")
              print("   ", error)
              sys.exit(0)

          print("FAIL: production accepted a key published in this repository")
          sys.exit(1)
          PY

      - name: Run automated tests
        run: |
          pytest tests -v

  # ==========================================================
  # JOB 4 — SECURITY SCAN
  # ==========================================================

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt --strict || true

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  # JOB 5 — DOCKER IMAGE
  # ==========================================================

  docker-build:
    name: Build and Publish CloudPulse Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, infra]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=CloudPulse
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudpulse:latest
            ghcr.io/${{ github.repository_owner }}/cloudpulse:${{ github.sha }}

      - name: Smoke test the published image
        run: |
          docker run -d --name cloudpulse-smoke \
            -e APP_ENV=production \
            -e SECRET_KEY=ci-smoke-secret \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/cloudpulse:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Image is healthy"
              docker rm -f cloudpulse-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Image did not become healthy"
          docker logs cloudpulse-smoke
          docker rm -f cloudpulse-smoke
          exit 1

      - name: Verify Docker image
        run: |
          echo "CloudPulse Docker image published successfully."
          echo "Registry: ghcr.io"
          echo "Repository: ${{ github.repository_owner }}/cloudpulse"
          echo "Commit: ${{ github.sha }}"
